<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Converter</title>
    <link rel="stylesheet" href="static/styles.css" />
</head>

<body>
    <div class="app">
        <header class="app-header">
            <h1>CSS Unit Converter</h1>
            <button id="themeToggle">🌙</button>
        </header>

        <!-- Desktop Tabs -->
        <nav class="tabs">
            <button class="tab active" data-tab="percentToPx">% → px</button>
            <button class="tab" data-tab="pxToPercent">px → %</button>
        </nav>

        <!-- Mobile Dropdown -->
        <select class="tab-dropdown">
            <option value="percentToPx">% → px</option>
            <option value="pxToPercent">px → %</option>
        </select>

        <div class="tab-content">
            <!-- Percentage to px -->
            <div class="panel active" id="percentToPx">
                <label>Percentage (%)</label>
                <input type="number" id="percentToPxInput" />
                <label>Base font size</label>
                <input type="number" id="percentToPxBase" value="16" />
                <p class="result" id="percentToPxResult"></p>
            </div>

            <!-- px to percentage -->
            <div class="panel" id="pxToPercent">
                <label>Pixel (px)</label>
                <input type="number" id="pxToPercentInput" />
                <label>Base font size</label>
                <input type="number" id="pxToPercentBase" value="16" />
                <p class="result" id="pxToPercentResult"></p>
            </div>
        </div>
    </div>

    <script src="static/script.js"></script>
</body>

</html>
